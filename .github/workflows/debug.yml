name: QQ 发消息测试

# 直接复制本文件到 .github/workflows/qq-debug.yml
# 运行：GitHub → Actions → QQ 发消息测试 → Run workflow
# 注意：把下面 env 里的三个值换成你自己的真实值（clientSecret 会明文进仓库，按需权衡）
on:
  workflow_dispatch:
    inputs:
      message:
        description: "要发送的消息"
        required: false
        default: "测试消息"

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      APP_ID: "1905624108"
      CLIENT_SECRET: "ywjU5TecNvFLFvNb"
      GROUP_OPENID: "CBF024063447F1F31379F78DC8BE7B13"
      MSG: ${{ github.event.inputs.message }}
    steps:
      - name: 取 token 并直接发群消息
        run: |
          set +x  # 不在日志里回显 token
          TOKEN=$(curl -s -X POST https://api.bot.qq.com/app/getAppAccessToken \
            -H 'Content-Type: application/json' \
            -d "{\"appId\":\"$APP_ID\",\"clientSecret\":\"$CLIENT_SECRET\"}" \
            | jq -r '.access_token')
          echo "token长度: ${#TOKEN}"

          echo "=== 发群消息原始响应（看 X-Tps-trace-ID 和 body）==="
          curl -s -i -X POST "https://api.bot.qq.com/v2/groups/$GROUP_OPENID/messages" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Authorization: QQBot $TOKEN" \
            -d "{\"msg_type\":0,\"content\":\"$MSG\",\"msg_seq\":1}"
          echo ""
